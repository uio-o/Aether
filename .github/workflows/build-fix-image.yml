name: Build fix image (local verification)

on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/**'
    paths:
      - '.github/workflows/build-fix-image.yml'
      - 'apps/aether-gateway/src/handlers/admin/provider/ops/providers/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: fix-image
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUST_BACKTRACE: '1'

jobs:
  build:
    name: Build fixed image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-musl

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fix-image-x86_64-unknown-linux-musl
          workspaces: . -> target

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        env:
          AETHER_BUILD_VERSION: fix-810
          AETHER_VERSION: fix-810
          AETHER_BUILD_TYPE: release
          CARGO_TERM_COLOR: always
        shell: bash
        run: |
          cross build --release --locked -p aether-gateway --target x86_64-unknown-linux-musl

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            aether-vscodex/web/package-lock.json

      - name: Install VSCodex web dependencies
        working-directory: aether-vscodex/web
        run: npm ci

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          AETHER_BUILD_VERSION: fix-810
          AETHER_VERSION: fix-810
        run: npm run build

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/frontend
          cp target/x86_64-unknown-linux-musl/release/aether-gateway dist/aether-gateway-amd64
          chmod 0755 dist/aether-gateway-amd64
          cp -R frontend/dist/. dist/frontend/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fixed image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.app
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/uio-o/aether:fix-810
          labels: |
            org.opencontainers.image.title=Aether
            org.opencontainers.image.version=fix-810
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
